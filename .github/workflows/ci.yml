name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: types, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm test

  python:
    name: python reference
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: python

      - run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run mypy --strict src tests

      - name: Tests
        run: uv run pytest -q

  eval-gate:
    name: eval regression gate
    runs-on: ubuntu-latest
    # The gate calls the model, so it only runs where the key is available.
    # Forked pull requests do not get repository secrets, and skipping is the
    # correct outcome there rather than a red run nobody can fix.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not set, so the eval gate was skipped. Add it in Settings > Secrets and variables > Actions to run the gate on every push."
          fi

      - name: Run the v2 eval against the baseline
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm eval --prompt v2 --gate

      - name: Upload the eval report
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            results/report.md
            results/v2.json
