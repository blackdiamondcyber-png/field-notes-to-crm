[project]
name = "fieldnotes"
version = "0.1.0"
description = "Python reference implementation of the field-notes-to-crm scoring, ported from src/lib/metrics.ts and src/summarize.ts to prove the scoring rules are specified precisely enough to reimplement."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["anthropic>=0.70.0"]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.7.0", "mypy>=1.13.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldnotes"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The prompt text is copied verbatim from src/prompts/*.ts and must stay
# byte-identical (test_prompts.py checks it) - it cannot be re-wrapped.
"src/fieldnotes/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

# anthropic is an optional extra (not installed by `uv sync` without --extra
# live), so CI's mypy run never has it. extract.py only imports it lazily,
# inside extract_activity(); this override lets that import type-check as
# Any instead of failing with "Cannot find implementation for module".
[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
